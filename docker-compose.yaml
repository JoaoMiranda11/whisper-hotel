volumes:
  volume-mysql:
  volume-arcturus-maven-repo:
  volume-arcturus-target:
  volume-nitro-converter-node-modules:
  volume-nitro-react-node-modules:

services:
  arcturus:
    container_name: arcturus
    build:
      context: emulator
    entrypoint: ["/bin/sh","/app/scripts/build.sh"]
    volumes:
      - ./emulator/:/app/
      - volume-arcturus-target:/app/arcturus/target
      - volume-arcturus-maven-repo:/root/.m2
    ports:
      - 3000:3000
      - 3001:3001
      - 2096:2096
    depends_on:
      - mysql
    networks:
      nitro:

  nitro:
    container_name: nitro
    build:
      context: nitro
    entrypoint: ["/bin/sh","/app/scripts/build.sh"]
    volumes:
      - ./nitro/:/app/
      - volume-nitro-converter-node-modules:/app/nitro-converter/node_modules
      - volume-nitro-react-node-modules:/app/nitro-react/node_modules
    ports:
      - 1080:5154
      - 8080:8080
      - 8081:8081
    networks:
      nitro:

  mysql:
    container_name: mysql
    image: mariadb:10.6
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_ROOT_PASSWORD=arcturus_root_pw
      - MYSQL_USER=arcturus_user
      - MYSQL_PASSWORD=arcturus_pw
      - MYSQL_DATABASE=arcturus
    volumes:
      - volume-mysql:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d
      - ./mysql/dumps:/docker-entrypoint-initdb.d
    ports:
      - 13306:3306
    networks:
      nitro:

  livekit:
    container_name: livekit
    image: livekit/livekit-server:v1.13.10
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${LK_NODE_IP:-127.0.0.1}"]
    environment:
      - "LIVEKIT_KEYS=${LK_KEY:?set LK_KEY in .env}: ${LK_SECRET:?set LK_SECRET in .env}"
      - LIVEKIT_TURN_ENABLED=${LK_TURN_ENABLED:-false}
      - LIVEKIT_TURN_DOMAIN=${LK_TURN_DOMAIN:-}
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - 7880:7880
      - 7881:7881/tcp
      - 7882:7882/udp
      - 3478:3478/udp
    restart: unless-stopped
    networks:
      nitro:

  voice-sidecar:
    container_name: voice-sidecar
    build:
      context: voice-sidecar
    environment:
      - PORT=8090
      - LK_KEY=${LK_KEY:?set LK_KEY in .env}
      - LK_SECRET=${LK_SECRET:?set LK_SECRET in .env}
      - LK_PUBLIC_URL=${LK_PUBLIC_URL:?set LK_PUBLIC_URL in .env}
      - VOICE_AUTH_SECRET=${VOICE_AUTH_SECRET:?set VOICE_AUTH_SECRET in .env}
      - NITRO_ORIGIN=${NITRO_ORIGIN:?set NITRO_ORIGIN in .env}
      - NITRO_PUBLIC_URL=${NITRO_PUBLIC_URL:-http://127.0.0.1:1080}
    ports:
      - 8090:8090
    depends_on:
      - livekit
    restart: unless-stopped
    networks:
      nitro:

networks:
  nitro:
